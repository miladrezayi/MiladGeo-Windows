name: Build MiladGeo Windows

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    defaults:
      run:
        working-directory: ./MiladGeo-Windows

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Build Windows
        run: npm run make

      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: MiladGeo-Windows-Build
          path: MiladGeo-Windows/out/**
          if-no-files-found: error
